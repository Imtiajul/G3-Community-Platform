      - published
      - archived
      type: string
      description: |-
        * `draft` - খসড়া (Draft)
        * `scheduled` - নির্ধারিত (Scheduled)
        * `published` - প্রকাশিত (Published)
        * `archived` - আর্কাইভ (Archived)
    Tag:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        color:
          type: string
          description: 'HEX color code e.g. #ff5733'
          maxLength: 20
      required:
      - id
      - name
      - slug
    TagRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        color:
          type: string
          minLength: 1
          description: 'HEX color code e.g. #ff5733'
          maxLength: 20
      required:
      - name
    TypeEnum:
      enum:
      - verification_request
      - verification_approved
      - verification_rejected
      - new_session
      - announcement
      - admin_message
      type: string
      description: |-
        * `verification_request` - যাচাইয়ের আবেদন (Verification Request)
        * `verification_approved` - আবেদন অনুমোদিত (Verification Approved)
        * `verification_rejected` - আবেদন প্রত্যাখ্যাত (Verification Rejected)
        * `new_session` - নতুন সেশন (New Session)
        * `announcement` - বিজ্ঞপ্তি (Announcement)
        * `admin_message` - অ্যাডমিন বার্তা (Admin Message)
    UserVerificationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          title: ইমেইল অ্যাড্রেস
          maxLength: 254
        first_name:
          type: string
          title: নামের প্রথম অংশ
          maxLength: 150
        last_name:
          type: string
          title: নামের শেষ অংশ
          maxLength: 150
        full_name:
          type: string
          readOnly: true
      required:
      - email
      - full_name
      - id
    VerificationRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserVerificationSummary'
          readOnly: true
        batch:
          type: integer
          readOnly: true
        batch_number:
          type: integer
          readOnly: true
        batch_name:
          type: string
          readOnly: true
        registration_no:
          type: string
          readOnly: true
          title: রেজিস্ট্রেশন নম্বর (স্ন্যাপশট)
        status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
        reviewed_by_email:
          type: string
          format: email
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        rejection_reason:
          type: string
          readOnly: true
          nullable: true
          title: প্রত্যাখ্যানের কারণ
        reviewer_note:
          type: string
          readOnly: true
          nullable: true
          title: পর্যালোচকের অভ্যন্তরীণ মন্তব্য
        roster_match:
          type: boolean
          readOnly: true
      required:
      - batch
      - batch_name
      - batch_number
      - id
      - registration_no
      - rejection_reason
      - reviewed_at
      - reviewed_by_email
      - reviewer_note
      - roster_match
      - status
      - submitted_at
      - user
    VerificationStatusEnum:
      enum:
      - unverified
      - pending
      - verified
      - rejected
      type: string
      description: |-
        * `unverified` - যাচাইবিহীন (Unverified)
        * `pending` - অপেক্ষমাণ (Pending)
        * `verified` - যাচাইকৃত (Verified)
        * `rejected` - প্রত্যাখ্যাত (Rejected)
    VisibilityEnum:
      enum:
      - public
      - members
      type: string
      description: |-
        * `public` - সবার জন্য উন্মুক্ত (Public)
        * `members` - শুধুমাত্র সদস্যদের জন্য (Members Only)
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    jwtCookieAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT Bearer token in ''Authorization: Bearer <token>'' header or
        HttpOnly cookie'
