      description: |-
        Public paginated session list:
        - Excludes members-only sessions (public visibility only).
        - Excludes drafts, scheduled, archived, and deleted sessions.
        - Cached with ETag and Cache-Control headers.
      parameters:
      - in: query
        name: batch
        schema:
          type: integer
      - in: query
        name: batch_id
        schema:
          type: integer
      - in: query
        name: date
