  /api/v1/community/sessions/:
    get:
      operationId: v1_community_sessions_list
      description: |-
        Main sessions endpoint for members and staff:
        - Staff see all statuses (draft, scheduled, published, archived).
        - Regular members see only published, non-deleted sessions.
        - Soft delete supported.
      parameters:
      - in: query
        name: batch
        schema:
          type: integer
      - in: query
        name: batch_id
        schema:
          type: integer
      - in: query
        name: date
        schema:
          type: string
          format: date
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: is_featured
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: session_number
        schema:
          type: integer
      - in: query
        name: state
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - archived
          - draft
          - published
          - scheduled
        description: |-
          * `draft` - খসড়া (Draft)
          * `scheduled` - নির্ধারিত (Scheduled)
          * `published` - প্রকাশিত (Published)
