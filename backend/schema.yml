        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: is_featured
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: session_number
        schema:
          type: integer
      - in: query
        name: state
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - archived
          - draft
          - published
          - scheduled
        description: |-
          * `draft` - খসড়া (Draft)
          * `scheduled` - নির্ধারিত (Scheduled)
          * `published` - প্রকাশিত (Published)
          * `archived` - আর্কাইভ (Archived)
      - in: query
        name: tag
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      - {}
      responses:
