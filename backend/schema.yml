openapi: 3.0.3
info:
  title: নিজের বলার মতো একটা গল্প API
  version: 1.0.0
  description: Headless Backend API for role-based community platform
paths:
  /api/v1/accounts/admin/users/{user_id}/verification/:
    post:
      operationId: v1_accounts_admin_users_verification_create
      description: Admin revokes verification back to unverified.
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: v1_accounts_admin_users_verification_partial_update
      description: Admin-only endpoint to edit a verified user's batch and registration_no.
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/google/:
    post:
      operationId: v1_accounts_google_create
      description: Sign up or sign in using a Google ID token verified server-side.
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/accounts/login/:
    post:
      operationId: v1_accounts_login_create
      description: Standard JWT login endpoint.
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/accounts/logout/:
    post:
      operationId: v1_accounts_logout_create
      description: Blacklists the refresh token and clears cookies.
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/me/:
    get:
      operationId: v1_accounts_me_retrieve
      description: View and update authenticated user profile.
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: v1_accounts_me_partial_update
      description: View and update authenticated user profile.
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/me/avatar/:
    post:
      operationId: v1_accounts_me_avatar_create
      description: |-
        POST /api/v1/accounts/me/avatar/
        Sets authenticated user's profile picture URL.
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/me/sessions/:
    get:
      operationId: v1_accounts_me_sessions_retrieve
      description: List active sessions for current user.
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/me/sessions/{session_id}/:
    delete:
      operationId: v1_accounts_me_sessions_destroy
      description: Revoke a specific session.
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/accounts/me/verification/:
    get:
      operationId: v1_accounts_me_verification_retrieve
      description: GET /me/verification returns status, latest request, rejection
        reason and missing fields.
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/me/verification/apply/:
    post:
      operationId: v1_accounts_me_verification_apply_create
      description: POST /me/verification/apply to submit a verification application.
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/password/change/:
    post:
      operationId: v1_accounts_password_change_create
      description: Change password or set password for Google-only users.
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/password/reset/:
    post:
      operationId: v1_accounts_password_reset_create
      description: Request password reset link without revealing user existence.
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/accounts/password/reset/confirm/:
    post:
      operationId: v1_accounts_password_reset_confirm_create
      description: Confirm password reset with signed token.
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/accounts/register/:
    post:
      operationId: v1_accounts_register_create
      description: User registration via email and password.
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/accounts/staff/verification-requests/:
    get:
      operationId: v1_accounts_staff_verification_requests_list
      description: Staff list of all verification requests with filtering and search.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVerificationRequestList'
          description: ''
  /api/v1/accounts/staff/verification-requests/{id}/:
    get:
      operationId: v1_accounts_staff_verification_requests_retrieve
      description: Staff detail view of a single verification request.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationRequest'
          description: ''
  /api/v1/accounts/staff/verification-requests/{id}/approve/:
    post:
      operationId: v1_accounts_staff_verification_requests_approve_create
      description: Staff endpoint to approve verification request (with concurrency
        lock).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/staff/verification-requests/{id}/reject/:
    post:
      operationId: v1_accounts_staff_verification_requests_reject_create
      description: Staff endpoint to reject verification request with required reason.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/accounts/token/refresh/:
    post:
      operationId: v1_accounts_token_refresh_create
      description: Refreshes access token with rotation and blacklist.
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/accounts/verification/confirm/:
    post:
      operationId: v1_accounts_verification_confirm_create
      description: Confirm email verification from link token.
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/accounts/verification/resend/:
    post:
      operationId: v1_accounts_verification_resend_create
      description: Resend email verification link without revealing user existence.
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/admin/analytics/:
    get:
      operationId: v1_admin_analytics_retrieve
      description: |-
        GET /api/v1/admin/analytics/
        Aggregated platform analytics with deltas, series, top sessions and batch stats.
        Admin only.
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/audit-logs/:
    get:
      operationId: v1_admin_audit_logs_list
      description: |-
        GET /api/v1/admin/audit-logs/
        List system audit logs. Admin only.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/admin/comments/:
    get:
      operationId: v1_admin_comments_list
      description: |-
        GET /api/v1/admin/comments/
        List comments for admin moderation with report counts. Admin only.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminCommentList'
          description: ''
  /api/v1/admin/comments/{id}/:
    patch:
      operationId: v1_admin_comments_partial_update
      description: |-
        PATCH /api/v1/admin/comments/{id}/
        DELETE /api/v1/admin/comments/{id}/
        Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: v1_admin_comments_destroy
      description: |-
        PATCH /api/v1/admin/comments/{id}/
        DELETE /api/v1/admin/comments/{id}/
        Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/moderators/:
    post:
      operationId: v1_admin_moderators_create
      description: Admin endpoint to create or invite a moderator with password-setup
        link.
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/notify/:
    post:
      operationId: v1_admin_notify_create
      description: |-
        POST /api/v1/admin/notify/
        Send in-app and email notification to targeted user groups. Admin only.
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/users/:
    get:
      operationId: v1_admin_users_list
      description: |-
        GET /api/v1/admin/users/
        List users with search, filtering, and aggregated engagement statistics.
        Admin only.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserListList'
          description: ''
  /api/v1/admin/users/{id}/:
    get:
      operationId: v1_admin_users_retrieve
      description: |-
        GET /api/v1/admin/users/{id}/
        PATCH /api/v1/admin/users/{id}/
        DELETE /api/v1/admin/users/{id}/ (soft delete)
        Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: v1_admin_users_partial_update
      description: |-
        GET /api/v1/admin/users/{id}/
        PATCH /api/v1/admin/users/{id}/
        DELETE /api/v1/admin/users/{id}/ (soft delete)
        Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: v1_admin_users_destroy
      description: |-
        GET /api/v1/admin/users/{id}/
        PATCH /api/v1/admin/users/{id}/
        DELETE /api/v1/admin/users/{id}/ (soft delete)
        Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin/users/{id}/assign-moderator/:
    post:
      operationId: v1_admin_users_assign_moderator_create
      description: |-
        POST /api/v1/admin/users/{id}/assign-moderator/
        Promotes user to moderator role. Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/users/{id}/revoke-moderator/:
    post:
      operationId: v1_admin_users_revoke_moderator_create
      description: |-
        POST /api/v1/admin/users/{id}/revoke-moderator/
        Revokes moderator role back to member. Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/announcements/:
    get:
      operationId: v1_announcements_list
      description: Staff CRUD for announcements with priority reordering.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnnouncementList'
          description: ''
    post:
      operationId: v1_announcements_create
      description: Staff CRUD for announcements with priority reordering.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnnouncementRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnnouncementRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
  /api/v1/announcements/{id}/:
    get:
      operationId: v1_announcements_retrieve
      description: Staff CRUD for announcements with priority reordering.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this announcement.
        required: true
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
    put:
      operationId: v1_announcements_update
      description: Staff CRUD for announcements with priority reordering.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this announcement.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnnouncementRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnnouncementRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
    patch:
      operationId: v1_announcements_partial_update
      description: Staff CRUD for announcements with priority reordering.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this announcement.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncementRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAnnouncementRequest'
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
    delete:
      operationId: v1_announcements_destroy
      description: Staff CRUD for announcements with priority reordering.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this announcement.
        required: true
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/announcements/reorder/:
    post:
      operationId: v1_announcements_reorder_create
      description: Accepts an ordered list of announcement IDs and updates priorities
        descending.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnnouncementRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnnouncementRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
          description: ''
  /api/v1/community/batches/:
    get:
      operationId: v1_community_batches_list
      description: CRUD for Batches. Staff can write; authenticated members can read.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBatchList'
          description: ''
    post:
      operationId: v1_community_batches_create
      description: CRUD for Batches. Staff can write; authenticated members can read.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BatchRequest'
        required: true
      security:
      - jwtCookieAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
          description: ''
